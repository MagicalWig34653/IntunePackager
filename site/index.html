    root.setAttribute("data-lang", lang);
    document.querySelectorAll("[data-i18n]").forEach(function (el) { el.textContent = t[el.getAttribute("data-i18n")]; });
    document.querySelectorAll("[data-aria-i18n]").forEach(function (el) { el.setAttribute("aria-label", t[el.getAttribute("data-aria-i18n")]); });
    document.querySelectorAll("[data-i18n-html]").forEach(function (el) { el.innerHTML = t[el.getAttribute("data-i18n-html")]; });
    document.querySelectorAll("img[data-shot]").forEach(function (img) {
      var name = img.getAttribute("data-shot");
      img.src = "img/mockup-" + name + "-" + lang + ".png";
      img.alt = t["shotAlt" + ({ start: 1, form: 2, result: 3 })[name]];
    });
    document.querySelectorAll("[data-set-lang]").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-set-lang") === lang));
    });
    document.title = "Intune Package Builder";
  }

  function initialLang() {
    try { var saved = localStorage.getItem("lang"); if (saved === "de" || saved === "en") return saved; } catch (e) { /* storage unavailable */ }
    return (navigator.language || "en").toLowerCase().indexOf("de") === 0 ? "de" : "en";
  }

  document.querySelectorAll("[data-set-lang]").forEach(function (b) {
    b.addEventListener("click", function () {
      var lang = b.getAttribute("data-set-lang");
      try { localStorage.setItem("lang", lang); } catch (e) { /* storage unavailable */ }
      applyLang(lang);
    });
  });

  applyLang(initialLang());
</script>
</body>
</html>
