name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore IntunePackageBuilder.sln
      - name: Check formatting
        if: matrix.os == 'windows-latest'
        run: dotnet format whitespace IntunePackageBuilder.sln --verify-no-changes --no-restore
      - name: Build
        run: dotnet build IntunePackageBuilder.sln --configuration Release --no-restore
      - name: Download the Win32 Content Prep Tool for the integration tests
        run: |
          # Not part of this repository (license: Microsoft terms, no redistribution). Pinned commit and SHA-256 as in THIRD-PARTY.md.
          $commit = '1d6cfcbdf8c28edc596337031f74df951f38f718'
          $expected = 'c1ba45b5cb939e84af064bb7ff4b38fb3dfe33c8dc1078fd9b157672eae671f6'
          $directory = Join-Path $env:RUNNER_TEMP 'content-prep'
          New-Item -ItemType Directory -Path $directory | Out-Null
          $exe = Join-Path $directory 'IntuneWinAppUtil.exe'
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/microsoft/Microsoft-Win32-Content-Prep-Tool/$commit/IntuneWinAppUtil.exe" -OutFile $exe
          $actual = (Get-FileHash -Algorithm SHA256 -Path $exe).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Unexpected SHA-256 of IntuneWinAppUtil.exe: $actual" }
          "IPB_CONTENT_PREP_TOOL=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Test
        run: dotnet test IntunePackageBuilder.sln --configuration Release --no-build --logger "trx;LogFileName=results.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testresults-${{ matrix.os }}
          path: "**/TestResults/*.trx"

  ui-tests:
    name: UI tests (FlaUI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build the program and the UI tests
        run: |
          dotnet build src/IntunePackageBuilder.App/IntunePackageBuilder.App.csproj --configuration Release
          dotnet build tests/IntunePackageBuilder.UiTests/IntunePackageBuilder.UiTests.csproj --configuration Release
      - name: Download the Win32 Content Prep Tool for the build test
        run: |
          # Same pinned download as in the build job (license: Microsoft terms, no redistribution; see THIRD-PARTY.md).
          $commit = '1d6cfcbdf8c28edc596337031f74df951f38f718'
          $expected = 'c1ba45b5cb939e84af064bb7ff4b38fb3dfe33c8dc1078fd9b157672eae671f6'
          $directory = Join-Path $env:RUNNER_TEMP 'content-prep'
          New-Item -ItemType Directory -Path $directory | Out-Null
          $exe = Join-Path $directory 'IntuneWinAppUtil.exe'
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/microsoft/Microsoft-Win32-Content-Prep-Tool/$commit/IntuneWinAppUtil.exe" -OutFile $exe
          $actual = (Get-FileHash -Algorithm SHA256 -Path $exe).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Unexpected SHA-256 of IntuneWinAppUtil.exe: $actual" }
          "IPB_CONTENT_PREP_TOOL=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run the UI tests
        run: dotnet test tests/IntunePackageBuilder.UiTests/IntunePackageBuilder.UiTests.csproj --configuration Release --no-build --logger "trx;LogFileName=results.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testresults-ui
          path: "**/TestResults/*.trx"

  distribution:
    name: Distribution (build and check)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build the program
        run: dotnet build src/IntunePackageBuilder.App/IntunePackageBuilder.App.csproj --configuration Release
      - name: Build the distribution ZIP and check it (A18)
        shell: powershell
        run: |
          .\tools\New-Distribution.ps1 -BuildOutput src\IntunePackageBuilder.App\bin\Release\net48 -OutputDirectory dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: distribution
          path: dist/*.zip
          if-no-files-found: error

  pester:
    name: Pester (Windows PowerShell 5.1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build the generators used by the Pester tests
        run: dotnet build src/IntunePackageBuilder.Generation/IntunePackageBuilder.Generation.csproj --configuration Release
      - name: Install Pester 5
        shell: powershell
        run: |
          # The runner image sometimes starts without a registered PSGallery; register it and retry the install.
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
              Register-PSRepository -Default
          }
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                  Install-Module -Name Pester -MinimumVersion 5.5.0 -Force -SkipPublisherCheck -Scope CurrentUser -ErrorAction Stop
                  break
              }
              catch {
                  if ($attempt -eq 3) { throw }
                  Start-Sleep -Seconds (5 * $attempt)
              }
          }
      - name: Run Pester
        shell: powershell
        run: |
          Import-Module Pester -MinimumVersion 5.5.0
          $config = New-PesterConfiguration
          $config.Run.Path = 'tests/pester'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = 'pester-results.xml'
          Invoke-Pester -Configuration $config
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pester-results
          path: pester-results.xml
