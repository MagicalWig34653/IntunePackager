name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: Build und Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore IntunePackageBuilder.sln
      - name: Build
        run: dotnet build IntunePackageBuilder.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test IntunePackageBuilder.sln --configuration Release --no-build --logger "trx;LogFileName=results.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testresults-${{ matrix.os }}
          path: "**/TestResults/*.trx"
